<style>
:root{
  --blue:#1F3864; --accent:#2E74B5; --light:#DEEAF6; --grey:#F2F4F7;
  --ok:#1E8E5A; --okbg:#E3F4EC; --nc:#C0392B; --ncbg:#FBE9E7; --na:#6B7280; --nabg:#EEF0F2;
  --border:#d6dee8; --muted:#6b7280; --shadow:0 2px 10px rgba(20,40,80,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
body{font-family:"Segoe UI",Roboto,Calibri,Arial,sans-serif;background:#eef1f6;color:#1c2430;font-size:16px;}
.app{max-width:920px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:var(--shadow);}
header{background:var(--blue);color:#fff;padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
header .brand{font-weight:800;letter-spacing:1px;font-size:20px;}
header .sub{font-size:11px;opacity:.85;}
header .grow{flex:1;}
header button.back{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;}
main{flex:1;padding:16px;}
h1{font-size:22px;color:var(--blue);margin:4px 0 6px;}
h2{font-size:17px;color:var(--accent);margin:18px 0 8px;}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.grid{display:grid;gap:10px;}
label.fld{display:block;font-size:13px;color:var(--muted);margin:2px 0 4px;font-weight:600;}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;}
textarea{min-height:80px;resize:vertical;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;}
.btn.primary{background:var(--blue);color:#fff;}
.btn.primary:disabled{background:#aab4c4;cursor:not-allowed;}
.btn.ghost{background:var(--grey);color:var(--blue);}
.btn.accent{background:var(--accent);color:#fff;}
.btn.wide{width:100%;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;font-size:17px;font-weight:700;color:var(--blue);cursor:pointer;box-shadow:var(--shadow);}
.menu-btn small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px;}
.menu-btn .ico{font-size:26px;}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.pill.emcurso{background:#FEF3C7;color:#92400E;}
.pill.concluida{background:var(--okbg);color:var(--ok);}
.pill.aaguardaraprovacao{background:#E0E7FF;color:#3730A3;}
.pill.aprovada{background:#DCFCE7;color:#166534;}
.pill.rejeitada{background:var(--ncbg);color:var(--nc);}
.fase-badge{display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:12px;padding:4px 12px;border-radius:8px;}
.fase-badge.f2{background:#6D28D9;}
.progress-wrap{margin:8px 0 12px;}
.progress-bar{height:12px;background:#e6ebf2;border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));width:0;transition:width .3s;}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;}
.sec-tag{display:inline-block;background:var(--light);color:var(--blue);font-weight:700;font-size:12px;padding:4px 10px;border-radius:8px;margin-bottom:8px;}
.crit{background:var(--grey);border-left:4px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;color:#33404f;font-size:15px;margin:8px 0 14px;}
.results{display:flex;gap:10px;flex-wrap:wrap;}
.res-btn{flex:1;min-width:90px;border:2px solid var(--border);background:#fff;border-radius:12px;padding:14px 8px;font-weight:800;font-size:15px;cursor:pointer;color:#33404f;}
.res-btn.C.active{border-color:var(--ok);background:var(--okbg);color:var(--ok);}
.res-btn.NC.active{border-color:var(--nc);background:var(--ncbg);color:var(--nc);}
.res-btn.NA.active{border-color:var(--na);background:var(--nabg);color:var(--na);}
.req{color:var(--nc);font-weight:800;}
.hint{background:var(--ncbg);color:var(--nc);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:6px;display:none;}
.hint.show{display:block;}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.photo{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.photo img{width:100%;height:100%;object-fit:cover;}
.photo .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:13px;}
.addphoto{width:92px;height:92px;border:2px dashed var(--accent);border-radius:10px;background:var(--light);color:var(--accent);font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.navbar{display:flex;gap:10px;position:sticky;bottom:0;background:#fff;padding:12px 0 max(4px,env(safe-area-inset-bottom));border-top:1px solid var(--border);}
.navbar .btn{flex:1;}
.counter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;}
.counter{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 6px;}
.counter .n{font-size:26px;font-weight:800;}
.counter .l{font-size:12px;color:var(--muted);}
.c-C .n{color:var(--ok);} .c-NC .n{color:var(--nc);} .c-NA .n{color:var(--na);} .c-P .n{color:#B45309;}
.list-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff;cursor:pointer;}
.list-item .t{flex:1;}
.list-item .code{font-size:12px;color:var(--muted);}
.small{font-size:13px;color:var(--muted);}
.pending{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--ncbg);background:#fff;border-radius:10px;margin-bottom:6px;font-size:14px;cursor:pointer;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;}
.toast.show{opacity:1;}
.toast.err{background:var(--nc);} .toast.ok{background:var(--ok);}
.big-ok{font-size:54px;text-align:center;color:var(--ok);margin:6px 0;}
.sig-pad{border:1px dashed var(--accent);border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block;}
.sig-img{height:70px;max-width:220px;border-bottom:1px solid #333;}
@media print{
  body{background:#fff;} header,.navbar,.no-print{display:none !important;}
  .app{box-shadow:none;max-width:100%;} main{padding:0;}
}
.rep h1{text-align:left;}
.rep table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
.rep th{background:var(--blue);color:#fff;text-align:left;padding:5px 7px;}
.rep td{border-bottom:1px solid var(--border);padding:5px 7px;vertical-align:top;}
.rep .kv{display:grid;grid-template-columns:170px 1fr;gap:2px 10px;font-size:13px;}
.rep .kv div.k{color:var(--muted);font-weight:600;}
.badge-res{font-weight:800;}
.res-C{color:var(--ok);} .res-NC{color:var(--nc);} .res-NA{color:var(--na);}
/* ===== refinamento visual (premium, leve) ===== */
body{background:#eaeef4;}
header{background:linear-gradient(135deg,#1B325A 0%,#2E74B5 100%);box-shadow:0 2px 12px rgba(20,40,80,.18);}
.hdr-logo{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1F3864;font-size:14px;letter-spacing:.5px;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:0 0 36px;}
h1{letter-spacing:-.3px;font-weight:800;}
.card{border-radius:16px;box-shadow:0 4px 16px rgba(20,40,80,.07);border-color:#e6ebf2;}
input,select,textarea{transition:border-color .15s, box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,116,181,.15);}
.btn{box-shadow:0 2px 6px rgba(20,40,80,.14);transition:transform .05s ease, filter .15s;}
.btn:active{transform:scale(.98);}
.btn.primary{background:linear-gradient(135deg,#1F3864,#2E74B5);}
.btn.accent{background:linear-gradient(135deg,#2E74B5,#3B8FD6);}
.menu-btn{transition:transform .05s ease, box-shadow .2s;align-items:center;}
.menu-btn:active{transform:scale(.99);}
.menu-btn .ico{width:46px;height:46px;border-radius:13px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 46px;}
.list-item{transition:transform .05s ease, box-shadow .15s;}
.list-item:active{transform:scale(.995);}
.brandmark{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#1F3864,#2E74B5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 14px;box-shadow:0 8px 22px rgba(31,56,100,.30);letter-spacing:1px;}
.auth-wrap{max-width:380px;margin:6vh auto 0;text-align:center;}
.auth-wrap .card{text-align:left;}
.foot{ text-align:center;color:#9aa6b6;font-size:11px;margin:18px 0 6px;}
.ov-hero{background:linear-gradient(135deg,#1F3864,#2E74B5);color:#fff;border:none;}
.ov-hero .ov-doc{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15;}
.ov-hero .ov-sub{opacity:.92;font-size:14px;margin-top:3px;}
.ov-hero .ov-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.ov-hero .ov-meta .small{color:#dbe6f6;}
.ov-hero .pill{background:rgba(255,255,255,.22);color:#fff;}
.ov-sec-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 2px 8px;}
.hdr-logo img{width:100%;height:100%;object-fit:contain;padding:4px;}
.brandmark{background:#fff !important;padding:12px;}
.brandmark img{width:100%;height:100%;object-fit:contain;}
</style>
</head>

function lastFase1(arr){ let l=-1; arr.forEach((p,i)=>{ if((p.fase||1)===1) l=i; }); return l; }
function setPontos(arr){
  PONTOS = (arr&&arr.length)? arr : BASE;
  N = PONTOS.length;
  FASE1 = PONTOS.filter(p=>(p.fase||1)===1);
  FASE2 = PONTOS.filter(p=>(p.fase||1)===2);

}

function uid(){ return "INS-"+new Date().getFullYear()+"-"+String(DB.length+1).padStart(4,"0"); }

function esc(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }

const main=document.getElementById("main"), btnBack=document.getElementById("btnBack"), hdrRight=document.getElementById("hdrRight");
btnBack.onclick=()=>{
  if(view==="checklist") return go(curSec?"seccao":"overview");
  if(["faseend","resumo","assinatura","seccao"].includes(view)) return go("overview");
  if(view==="relatorio") return go(cur&&cur.estado==="Em curso"?"overview":"lista");
  go("home");
};
function go(v){ view=v; window.scrollTo(0,0); render(); }

function render(){
  const lb=document.getElementById("langBtn"); if(lb) lb.textContent=LANG.toUpperCase();
  hdrRight.innerHTML = (cur?cur.id+"<br>":"") + (cur?((cur.docCode||DOC_CODE)+"_"+(cur.docVer||DOC_VER)):DOC_FULL);
  // BARREIRA DE LOGIN: com a nuvem configurada, só entra autenticado
  if(cfgValid()){
    if(!authResolved) { btnBack.style.display="none"; return renderLoading(); }
    if(!FBuser) { btnBack.style.display="none"; return (view==="registo"?renderRegisto():renderLogin()); }

  btnBack.style.display=(view==="home")?"none":"inline-block";
  ({home:renderHome,nova:renderNova,lista:renderLista,overview:renderOverview,seccao:renderSeccao,checklist:renderChecklist,faseend:renderFaseEnd,resumo:renderResumo,assinatura:renderAssinatura,relatorio:renderRelatorio,sync:renderSync,mudarpw:renderMudarPw,sobre:sobre,config:renderConfig,configfam:renderConfigFam,configponto:renderConfigPonto,configrev:renderConfigRev}[view]||renderHome)();
}

async function limparTudo(){
  const ids=DB.map(i=>i.id); DB=[]; cur=null;
  try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}

  if(cloudReady&&FBuser){ for(const id of ids){ try{ await FBdb.collection("inspecoes").doc(id).delete(); }catch(e){} } toast("Base de dados limpa.","ok"); if(view==="home")render(); }
}

function criarInspecao(){
  const d=val("f_doc"), insp=val("f_insp"), famNome=val("f_fam");
  if(!d||!insp){ toast(t('preencha_doc_insp'),"err"); return; }
  const fam=famByName(famNome);
  cur={ id:uid(), familia:fam.nome, pontos:clonePts(fam.pontos), revisoes:clonePts(REVISOES),
        docCode:DOC_CODE, docVer:DOC_VER,
        doc:d, serie:val("f_serie"), projeto:val("f_proj"), cliente:val("f_cli"), local:val("f_loc"),
        inspetor:insp, inicio:Date.now(), fase1Fim:null, fim:null, estado:"Em curso",
        respostas:{}, utilizador:"" };
  setPontos(cur.pontos);
  DB.push(cur); save(); idx=0; go("overview"); toast("Inspeção "+cur.id+" criada.","ok");
}

function abrir(id){ cur=DB.find(i=>i.id===id); setPontos(cur.pontos||BASE); if(typeof hydrate==="function") hydrate(cur); if(cur.estado==="Em curso") go("overview"); else go("relatorio"); }

// ===== CHECKLIST =====
function resp(){ return cur.respostas[PONTOS[idx].c]||{}; }
function isValid(p,r){
  if((p.tp==="CNCNA"||p.tp==="SimNao") && !r.resultado) return false;
  if(p.tp==="Numerico" && (r.valor===undefined||r.valor===""||isNaN(r.valor))) return false;
  if(p.tp==="Texto" && p.ob && !(r.obs&&r.obs.trim())) return false;
  if(r.resultado==="NC" && !(r.obs&&r.obs.trim())) return false;
  if(r.resultado==="NA" && !(r.obs&&r.obs.trim())) return false;
  if(p.rf && (!r.fotos||!r.fotos.length)) return false;
  if(p.tp==="Numerico" && !isNaN(r.valor) && r.valor!==""){
    if(p.min!==undefined && +r.valor<p.min) return false;
    if(p.max!==undefined && +r.valor>p.max) return false;
  }
  return true;
}
function missMsg(p,r){
  if((p.tp==="CNCNA"||p.tp==="SimNao") && !r.resultado) return "Selecione um resultado.";
  if(p.tp==="Numerico" && (r.valor===undefined||r.valor===""||isNaN(r.valor))) return "Introduza um valor numérico.";
  if(p.tp==="Numerico" && !isNaN(r.valor) && r.valor!=="" && ((p.min!==undefined&&+r.valor<p.min)||(p.max!==undefined&&+r.valor>p.max)))
     return "Valor fora do critério ("+(p.min!==undefined?"≥ "+p.min:"≤ "+p.max)+" "+p.unid+").";
  if(r.resultado==="NC" && !(r.obs&&r.obs.trim())) return "Descreva a não conformidade.";
  if(r.resultado==="NA" && !(r.obs&&r.obs.trim())) return "Justifique o «Não aplicável».";
  if(p.tp==="Texto" && p.ob && !(r.obs&&r.obs.trim())) return "Preencha o campo obrigatório.";
  if(p.rf && (!r.fotos||!r.fotos.length)) return "Anexe pelo menos uma fotografia ou documento.";
  return "";
}
function doneInFase(f){ return PONTOS.filter(p=>p.fase===f && cur.respostas[p.c] && cur.respostas[p.c].concluido).length; }
function pendFase(f){ return PONTOS.filter(p=>p.fase===f && p.ob && (!cur.respostas[p.c]||!cur.respostas[p.c].concluido)); }

function renderChecklist(){
  const p=PONTOS[idx], r=resp(), valid=isValid(p,r);
  const total=(p.fase===1?FASE1.length:FASE2.length);
  const done=doneInFase(p.fase);
  const localNo=(p.fase===1?idx+1:idx-FASE1.length+1);
  const pct=Math.round(done/total*100);
  let resultUI="";
  if(p.tp==="CNCNA"){
    resultUI=`<div class="results">${["C","NC","NA"].map(o=>`<button class="res-btn ${o} ${r.resultado===o?'active':''}" onclick="setRes('${o}')">${o==="C"?"Conforme":o==="NC"?"Não conforme":"N/A"}</button>`).join("")}</div>`;
  } else if(p.tp==="Numerico"){
    resultUI=`<div class="row" style="align-items:flex-end"><div><label class="fld">Valor medido <span class="req">*</span></label>
      <input type="number" step="any" inputmode="decimal" id="numv" value="${r.valor??''}" oninput="setNum(this.value)"></div>
      <div style="flex:0 0 64px;text-align:center;font-weight:800;color:var(--accent);padding-bottom:14px">${p.unid||""}</div></div>
      <div class="small">Critério: ${p.min!==undefined?"≥ "+p.min:""}${p.max!==undefined?"≤ "+p.max:""} ${p.unid||""}</div>`;
  }
  const obsReq=(r.resultado==="NC"||r.resultado==="NA"||(p.tp==="Texto"&&p.ob));
  main.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <span class="fase-badge ${p.fase===2?'f2':''}">${t('fase')||'Fase'} ${p.fase}</span>
      <span class="small">${esc(cur.familia||'')}</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-meta"><span>${t('fase')} ${p.fase} · ${t('ponto')} ${localNo} ${t('de')} ${total}</span><span>${pct}% · ${done} ${t('concluidos')}</span></div>
    </div>
    <div class="card">
      <span class="sec-tag">${esc(pS(p))}</span>
      <div><b>${p.c}</b> · <b>${esc(pT(p))}</b></div>
      <div class="crit">${esc(pCr(p))}</div>
      ${resultUI}
      <div style="margin-top:12px"><label class="fld">Observações ${obsReq?'<span class="req">*</span>':''}</label>
        <textarea id="obs" placeholder="${r.resultado==='NA'?'Justificação obrigatória…':(r.resultado==='NC'?'Descreva a não conformidade…':'Notas (opcional)…')}" oninput="setObs(this.value)">${esc(r.obs||"")}</textarea></div>
      <div style="margin-top:10px">
        <label class="fld">Fotografias ou documentos ${p.rf?'<span class="req">*</span> <span class="small">(obrigatório)</span>':'<span class="small">(opcional)</span>'}</label>
        <div class="photos">
          ${(r.fotos||[]).map((f,i)=>{const o=normFoto(f);return `<div class="photo">${o.img?`<img src="${o.d}">`:`<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--light);color:var(--blue);font-size:11px;padding:4px;text-align:center">📄<span style="margin-top:2px;word-break:break-all">${esc(shortName(o.n))}</span></div>`}<button class="del" onclick="delFoto(${i})">×</button></div>`;}).join("")}
          <label class="addphoto">＋<input type="file" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" style="display:none" onchange="addFoto(event)"></label>
        </div>
        <div class="small" style="margin-top:4px">Fotos (câmara/galeria) ou documentos (PDF, Word, Excel).</div>
      </div>
      <div class="hint ${valid?'':'show'}" id="hint">${missMsg(p,r)}</div>
    </div>
    <div class="navbar no-print">
      <button class="btn ghost" ${idx===0?'disabled':''} onclick="prev()">‹ Anterior</button>
      ${idx<N-1 ? `<button class="btn primary" id="next" onclick="next()">Seguinte ›</button>`
                : `<button class="btn accent" onclick="irResumo()">Ver resumo ›</button>`}
    </div>`;
}
function persist(concluido){ const p=PONTOS[idx]; const r=Object.assign({},cur.respostas[p.c]||{}); r.concluido=(concluido!==undefined?concluido:isValid(p,r)); cur.respostas[p.c]=r; save(); }
function setRes(o){ const p=PONTOS[idx]; const r=cur.respostas[p.c]||{}; r.resultado=(r.resultado===o?null:o); cur.respostas[p.c]=r; persist(); renderChecklist(); }
function setNum(v){ const p=PONTOS[idx]; const r=cur.respostas[p.c]||{}; r.valor=v; cur.respostas[p.c]=r; persist(); updateNav(); }
function setObs(v){ const p=PONTOS[idx]; const r=cur.respostas[p.c]||{}; r.obs=v; cur.respostas[p.c]=r; persist(); updateNav(); }
function updateNav(){ const p=PONTOS[idx],r=resp(),v=isValid(p,r); const h=document.getElementById("hint"); if(h){h.textContent=missMsg(p,r); h.className="hint "+(v?'':'show');} }
function normFoto(f){ if(typeof f==="string") return {id:"L"+f.length,d:f,img:true,n:"foto.jpg"}; if(f&&!f.id) f.id="F"+Math.random().toString(36).slice(2,9); return f; }
function shortName(n){ n=n||"ficheiro"; return n.length>16?n.slice(0,7)+"…"+n.slice(-6):n; }
function addFoto(e){ const f=e.target.files[0]; if(!f)return; const isImg=(f.type||"").startsWith("image/"); const rd=new FileReader();
  rd.onload=()=>{ const store=o=>{ const p=PONTOS[idx]; const r=cur.respostas[p.c]||{}; r.fotos=r.fotos||[]; r.fotos.push(o); cur.respostas[p.c]=r; persist(); renderChecklist(); };
    const fid="F"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(isImg) resizeImg(rd.result,1280,img=>store({id:fid,d:img,img:true,n:f.name})); else store({id:fid,d:rd.result,img:false,n:f.name}); };
  rd.readAsDataURL(f); }
function resizeImg(dataUrl,maxW,cb){ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>maxW){h=h*maxW/w;w=maxW;} const cv=document.createElement("canvas"); cv.width=w;cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); cb(cv.toDataURL("image/jpeg",0.7)); }; img.onerror=()=>cb(dataUrl); img.src=dataUrl; }
function delFoto(i){ const p=PONTOS[idx]; cur.respostas[p.c].fotos.splice(i,1); persist(); renderChecklist(); }
function next(){ const p=PONTOS[idx]; persist(isValid(p,resp())); if(idx===FASE1_LAST){ go("faseend"); return; } if(idx<N-1){ idx++; go("checklist"); } }
function prev(){ persist(); if(idx>0){ idx--; go("checklist"); } }
function irResumo(){ persist(isValid(PONTOS[idx],resp())); go("resumo"); }

// ===== Assinatura no ecrã (reutilizável) =====
let _sig={cv:null,ctx:null,empty:true,drawing:false};
function sigBlock(id, existing, label){
  return `<label class="fld">${label||"Assinatura"}</label>
    <canvas class="sig-pad" id="${id}"></canvas>
    <div class="row" style="margin-top:8px"><button class="btn ghost" type="button" onclick="clearSig()">Limpar assinatura</button></div>`;
}
function initSig(id, existing){
  const cv=document.getElementById(id); if(!cv) return;
  const r=cv.getBoundingClientRect(); cv.width=r.width||600; cv.height=r.height||170;
  const ctx=cv.getContext("2d"); ctx.lineWidth=2.5; ctx.lineCap="round"; ctx.strokeStyle="#1F3864";
  _sig={cv,ctx,empty:true,drawing:false};
  const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-b.left,y:t.clientY-b.top};};
  const start=e=>{_sig.drawing=true;_sig.empty=false;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!_sig.drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
  const end=()=>{_sig.drawing=false;};
  cv.onmousedown=start;cv.onmousemove=move;window.onmouseup=end;
  cv.ontouchstart=start;cv.ontouchmove=move;cv.ontouchend=end;
  if(existing){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,cv.width,cv.height); img.src=existing; _sig.empty=false; }
}
function clearSig(){ if(_sig.ctx){ _sig.ctx.clearRect(0,0,_sig.cv.width,_sig.cv.height); _sig.empty=true; } }
function sigGet(existing){ if(_sig.cv && !_sig.empty) return _sig.cv.toDataURL("image/png"); return existing||null; }

// ===== RELATÓRIO =====
function renderRelatorio(){
  const k={C:cur.totalC||0,NC:cur.totalNC||0,NA:cur.totalNA||0};
  const rowsFor=f=>PONTOS.filter(p=>p.fase===f).map(p=>{const r=cur.respostas[p.c]||{};
    const res=r.resultado||(p.tp==="Numerico"?(r.valor!==undefined&&r.valor!==""?r.valor+" "+(p.unid||""):"—"):(r.obs?"Preenchido":"—"));
    const cls=r.resultado?("res-"+r.resultado):"";

let FBauth=null, FBdb=null, FBuser=null, cloudReady=false, unsub=null, cloudTimer=null;
let authResolved=false, isAdmin=false, ADMINS=[];
const uploadedAtt=new Set();
function cfgValid(){ const c=window.FIREBASE_CONFIG; return !!(c && c.apiKey && String(c.apiKey).indexOf("COLA_AQUI")<0 && c.projectId); }
function syncStatus(){
  if(!cfgValid()) return LANG==='pt'?"Local apenas · toque para configurar a nuvem":"Local only · tap to set up the cloud";
  if(!cloudReady) return LANG==='pt'?"A ligar à nuvem…":"Connecting to the cloud…";
  if(FBuser) return t('ligado_como')+" "+FBuser.email;
  return LANG==='pt'?"Configurado · toque para entrar":"Configured · tap to sign in";
}
function initSync(){
  if(!cfgValid()){ authResolved=true; return; }        // sem nuvem: modo local
  if(typeof firebase==="undefined"){ authResolved=true; render(); return; } // SDK não carregou (offline 1.ª vez)
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    FBauth=firebase.auth(); FBdb=firebase.firestore();
    FBdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    cloudReady=true;
    FBauth.onAuthStateChanged(u=>{ FBuser=u; authResolved=true; isAdmin=false; if(u){ subscribe(); loadAdmins(); loadFamilias(); loadRevisoes(); } else if(unsub){unsub();unsub=null;} render(); });
  }catch(e){ cloudReady=false; authResolved=true; render(); }
}
function loadAdmins(){
  if(!cloudReady||!FBuser) return;
  FBdb.collection("config").doc("app").get().then(d=>{
    const data=(d&&d.exists)?d.data():{}; ADMINS=(data.admins||[]).map(x=>String(x).toLowerCase());
    isAdmin=ADMINS.includes((FBuser.email||"").toLowerCase());
    if(view==="home"||view==="sync") render();
  }).catch(()=>{ isAdmin=false; });
}
function subscribe(){
  if(unsub)unsub();
  unsub=FBdb.collection("inspecoes").onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const remote=ch.doc.data(); if(!remote||!remote.id) return;
      const li=DB.findIndex(x=>x.id===remote.id);
      const editing = cur && cur.id===remote.id && ["checklist","assinatura","resumo","faseend"].includes(view);
      if(editing) return; // quem está a editar tem prioridade
      if(ch.type==="removed"){ if(li>=0){ DB.splice(li,1);} }
      else { const merged=mergeCloud(li>=0?DB[li]:null, remote); if(li>=0)DB[li]=merged; else DB.push(merged); if(cur&&cur.id===merged.id)cur=merged; }
    });
    try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
    if(["home","lista","relatorio","sync"].includes(view)) render();
  }, err=>{ console.warn("sync",err); });
}
function mergeCloud(local, remote){
  const localAtt={}; if(local&&local.respostas) Object.values(local.respostas).forEach(r=>(r.fotos||[]).forEach(f=>{ if(f&&f.id&&f.d) localAtt[f.id]=f; }));
  const out=JSON.parse(JSON.stringify(remote));
  if(out.respostas) Object.values(out.respostas).forEach(r=>{ if(r.fotos) r.fotos=r.fotos.map(f=>({...f, d:(f.d|| (localAtt[f.id]&&localAtt[f.id].d) || null)})); });
  return out;
}
function scheduleCloud(){ if(!cloudReady||!FBuser||!cur) return; clearTimeout(cloudTimer); const snap=cur; cloudTimer=setTimeout(()=>pushCloud(snap),1200); }
async function pushCloud(insp){
  if(!cloudReady||!FBuser||!insp) return;
  try{
    const light=JSON.parse(JSON.stringify(insp)); const atts=[];
    if(light.respostas) Object.values(light.respostas).forEach(r=>{ if(r.fotos) r.fotos=r.fotos.map(f=>{ f=normFoto(f); if(f.d) atts.push({id:f.id,n:f.n,img:f.img,d:f.d}); return {id:f.id,n:f.n,img:f.img}; }); });
    light.uid=FBuser.uid; light.updatedAt=Date.now();
    await FBdb.collection("inspecoes").doc(insp.id).set(light,{merge:true});
    for(const a of atts){ if(!uploadedAtt.has(insp.id+"/"+a.id)){ try{ await FBdb.collection("inspecoes").doc(insp.id).collection("anexos").doc(a.id).set({n:a.n,img:a.img,d:a.d}); uploadedAtt.add(insp.id+"/"+a.id); }catch(e){} } }
  }catch(e){ /* offline: o Firestore reenvia quando voltar a ligação */ }
}
async function hydrate(insp){
  if(!cloudReady||!FBuser||!insp) return;
  const falta=Object.values(insp.respostas||{}).some(r=>(r.fotos||[]).some(f=>f&&!f.d));
  if(!falta) return;
  try{
    const snap=await FBdb.collection("inspecoes").doc(insp.id).collection("anexos").get();
    const map={}; snap.forEach(d=>map[d.id]=d.data());
    Object.values(insp.respostas||{}).forEach(r=>{ if(r.fotos) r.fotos=r.fotos.map(f=>(!f.d&&map[f.id])?{...f,d:map[f.id].d,n:map[f.id].n,img:map[f.id].img}:f); });
    try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
    if(["relatorio","checklist"].includes(view)) render();
  }catch(e){}
}
async function apagarNuvem(id){ if(cloudReady&&FBuser){ try{ await FBdb.collection("inspecoes").doc(id).delete(); }catch(e){} } }

}

function sair(){ FBauth.signOut().then(()=>{toast("Sessão terminada.","ok");go("sync");}); }
function trad(e){ const c=e&&e.code; const m={"auth/invalid-email":"Email inválido.","auth/user-not-found":"Utilizador não encontrado.","auth/wrong-password":"Palavra-passe errada.","auth/email-already-in-use":"Este email já tem conta — use «Entrar».","auth/weak-password":"Palavra-passe fraca (mín. 6).","auth/invalid-credential":"Credenciais inválidas.","auth/operation-not-allowed":"Falta ativar Email/palavra-passe no Firebase (Authentication).","auth/unauthorized-domain":"Domínio não autorizado no Firebase (Authentication → Definições → Domínios autorizados).","auth/network-request-failed":"Sem ligação à internet.","auth/requires-recent-login":"Por segurança, termine sessão e volte a entrar antes de mudar a palavra-passe.","auth/too-many-requests":"Demasiadas tentativas. Tente mais tarde."}; return m[c]||("Erro: "+(c||(e&&e.message)||e)); }

  main.innerHTML=`<h1>${novo?'Novo ponto':'Editar ponto'}</h1>

      <div class="row"><div><label class="fld">Código</label><input id="p_c" value="${esc(p.c)}" placeholder="ex.: 1.1"></div>
      <div><label class="fld">Fase</label><select id="p_fase"><option value="1" ${(p.fase||1)==1?'selected':''}>1</option><option value="2" ${(p.fase||1)==2?'selected':''}>2</option></select></div></div>
      <div><label class="fld">Secção (PT)</label><input id="p_s" value="${esc(p.s)}" placeholder="ex.: 1. Documentação"></div>
      <div><label class="fld">Secção (EN)</label><input id="p_sen" value="${esc(p.s_en||'')}" placeholder="ex.: 1. Documentation"></div>
      <div><label class="fld">Título (PT)</label><input id="p_t" value="${esc(p.t)}"></div>
      <div><label class="fld">Título (EN)</label><input id="p_ten" value="${esc(p.t_en||'')}"></div>
      <div><label class="fld">Critério (PT)</label><textarea id="p_cr">${esc(p.cr)}</textarea></div>
      <div><label class="fld">Critério (EN)</label><textarea id="p_cren">${esc(p.cr_en||'')}</textarea></div>
      <div class="row"><div><label class="fld">Tipo de resposta</label><select id="p_tp">
        ${["CNCNA","Numerico","Texto"].map(o=>`<option ${p.tp===o?'selected':''}>${o}</option>`).join("")}
      </select></div>
      <div><label class="fld">Obrigatório</label><select id="p_ob"><option value="1" ${p.ob?'selected':''}>Sim</option><option value="0" ${!p.ob?'selected':''}>Não</option></select></div></div>
      <div class="row"><div><label class="fld">Mín (num.)</label><input id="p_min" value="${p.min??''}"></div>
      <div><label class="fld">Máx (num.)</label><input id="p_max" value="${p.max??''}"></div>
      <div><label class="fld">Unidade</label><input id="p_unid" value="${esc(p.unid||'')}"></div></div>
    </div>
    <button class="btn primary wide" onclick="salvarPonto()">${t('guardar')}</button>
    <button class="btn ghost wide" style="margin-top:8px" onclick="go('configfam')">${t('cancelar')}</button>`;
}
function salvarPonto(){
  const p={ c:val("p_c"), s:val("p_s"), s_en:val("p_sen"), t:val("p_t"), t_en:val("p_ten"), cr:val("p_cr"), cr_en:val("p_cren"), tp:val("p_tp"), ob: val("p_ob")==="1"?1:0, rf:0, fase: parseInt(val("p_fase"))||1 };
  const mn=val("p_min"), mx=val("p_max"), un=val("p_unid");
  if(mn!=="") p.min=parseFloat(mn.replace(",",".")); if(mx!=="") p.max=parseFloat(mx.replace(",",".")); if(un) p.unid=un;
  if(!p.c||!p.t){ toast("Código e título (PT) são obrigatórios.","err"); return; }
  if(curPtIdx<0) curFam.pontos.push(p); else curFam.pontos[curPtIdx]=p;
  saveFamilia(curFam); toast("Ponto guardado.","ok"); go("configfam");
}
function renderConfigRev(){ go("sobre"); } // revisões geridas na página Sobre
// Revisões GLOBAIS (geridas na página Sobre pelo administrador)
function editRev(i){
  if(!isAdmin) return;
  const novo=i<0; const h=novo?{rev:"",data:"",nota:"",resp:"",apr:""}:REVISOES[i];
  const rev=prompt("Revisão (ex.: 03):", h.rev); if(rev===null)return;
  const data=prompt("Data (dd/mm/aaaa):", h.data||new Date().toLocaleDateString("pt-PT")); if(data===null)return;
  const nota=prompt("Natureza da mudança:", h.nota); if(nota===null)return;
  const resp=prompt("Responsável:", h.resp); if(resp===null)return;
  const apr=prompt("Aprovado por:", h.apr); if(apr===null)return;
  const obj={rev:(rev||"").trim(),data:(data||"").trim(),nota:(nota||"").trim(),resp:(resp||"").trim(),apr:(apr||"").trim()};
  if(novo) REVISOES.push(obj); else REVISOES[i]=obj;
  saveRevisoes(); render();
}
function delRev(i){ if(!isAdmin)return; if(confirm("Apagar revisão?")){ REVISOES.splice(i,1); saveRevisoes(); render(); } }
function loadRevisoes(){
  if(!cloudReady||!FBuser) return;
  FBdb.collection("config").doc("versoes").get().then(d=>{ if(d&&d.exists&&Array.isArray(d.data().linhas)) REVISOES=d.data().linhas; if(view==="sobre")render(); }).catch(()=>{});
}
function saveRevisoes(){
  if(!cloudReady||!FBuser){ toast("Sem ligação — alteração só neste dispositivo.","err"); return; }
  FBdb.collection("config").doc("versoes").set({linhas:REVISOES, updatedAt:Date.now()}).catch(e=>toast(trad(e),"err"));
}

// ===== PWA =====
if("serviceWorker" in navigator && location.protocol!=="file:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

render();
window.addEventListener("load", initSync);
</script>
